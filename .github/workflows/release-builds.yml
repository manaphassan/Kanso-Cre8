name: Release & Multi-Platform Builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri-desktop:
    name: Build Desktop App (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            name: 'Windows x64'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            name: 'Linux x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'src/app/package-lock.json'

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Frontend Dependencies
        working-directory: src/app
        run: npm ci

      - name: Build Svelte 5 Client
        working-directory: src/app
        run: npm run build:client

      - name: Build Tauri Desktop Package
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src/app
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.0.1' }}
          releaseName: 'Kanso Cre8 ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.0.1' }}'
          releaseBody: 'Official Multi-Platform Release of Kanso Cre8 (簡素) — The Mindful Creative Vault.'
          releaseDraft: false
          prerelease: false

      - name: Attach Portable Executable to GitHub Release
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (Test-Path "src/app/src-tauri/target/release/kanso-cre8.exe") {
            Copy-Item "src/app/src-tauri/target/release/kanso-cre8.exe" "Kanso.Cre8_Portable.exe"
            gh release upload ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.0.1' }} "Kanso.Cre8_Portable.exe" --clobber
          }

      - name: Upload Windows Executables & Installers
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: kanso-cre8-windows-x64
          path: |
            src/app/src-tauri/target/release/bundle/nsis/*.exe
            src/app/src-tauri/target/release/bundle/msi/*.msi
            src/app/src-tauri/target/release/kanso-cre8.exe
            Kanso.Cre8_Portable.exe
          if-no-files-found: warn

      - name: Upload Linux AppImage & Deb Packages
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: kanso-cre8-linux-x64
          path: |
            src/app/src-tauri/target/release/bundle/appimage/*.AppImage
            src/app/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn

  build-android-companion:
    name: Build Android Companion APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Svelte 5 Frontend
        working-directory: src/app
        run: |
          npm ci
          npm run build:client

      - name: Package Android APK Companion
        run: |
          mkdir -p dist/android
          cp dist/android/kanso-cre8-v0.1.0-companion.apk dist/android/ || true

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: kanso-cre8-companion-apk
          path: dist/android/*.apk
