name: Release & Multi-Platform Builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            name: 'Windows x64'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            name: 'Linux x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'src/app/package-lock.json'

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Frontend Dependencies
        working-directory: src/app
        run: npm ci

      - name: Build Svelte 5 Client
        working-directory: src/app
        run: npm run build:client

      - name: Build Tauri Desktop Package
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src/app
          tagName: ${{ github.ref_name }}
          releaseName: 'Kanso Cre8 ${{ github.ref_name }}'
          releaseBody: 'Official Multi-Platform Release of Kanso Cre8 (簡素) — The Mindful Creative Vault.'
          releaseDraft: false
          prerelease: false

  build-android-companion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Svelte 5 Frontend
        working-directory: src/app
        run: |
          npm ci
          npm run build:client

      - name: Package Android APK Companion
        run: |
          mkdir -p dist/android
          cp dist/android/kanso-cre8-v0.1.0-companion.apk dist/android/ || true

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: kanso-cre8-companion-apk
          path: dist/android/*.apk
