name: Tauri v2 Cross-Platform Desktop Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    name: Build Desktop App (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: src/app/package-lock.json

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux System Dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev

      - name: Install Node Dependencies
        working-directory: src/app
        run: npm ci

      - name: Build Svelte 5 Client
        working-directory: src/app
        run: npm run build:client

      - name: Build Tauri Desktop Application
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src/app
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.0.1' }}
          releaseName: 'Kanso Cre8 v__VERSION__'
          releaseBody: 'The Mindful Creative Vault — Local-First Project, Client & Knowledge Engine for Freelance Designers.'
          releaseDraft: false
          prerelease: false

      - name: Attach Portable Executable to GitHub Release
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (Test-Path "src/app/src-tauri/target/release/kanso-cre8.exe") {
            Copy-Item "src/app/src-tauri/target/release/kanso-cre8.exe" "Kanso.Cre8_0.0.1_x64_Portable.exe"
            gh release upload ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.0.1' }} "Kanso.Cre8_0.0.1_x64_Portable.exe" --clobber
          }

      - name: Upload Windows Executables & Installers
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: kanso-cre8-windows-x64
          path: |
            src/app/src-tauri/target/release/bundle/nsis/*.exe
            src/app/src-tauri/target/release/bundle/msi/*.msi
            src/app/src-tauri/target/release/kanso-cre8.exe
            Kanso.Cre8_0.0.1_x64_Portable.exe
          if-no-files-found: warn
