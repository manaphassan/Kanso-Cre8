name: Tauri v2 Cross-Platform Desktop Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    name: Build Desktop App (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: src/app/package-lock.json

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux System Dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libayatana-appindicator3-dev

      - name: Install Node Dependencies
        working-directory: src/app
        run: npm ci

      - name: Build Svelte 5 Client
        working-directory: src/app
        run: npm run build:client

      - name: Build Tauri Desktop Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src/app
          tagName: ${{ github.ref_name }}
          releaseName: 'Kanso Cre8 v__VERSION__'
          releaseBody: 'The Mindful Creative Vault — Local-First Project, Client & Knowledge Engine for Freelance Designers.'
          releaseDraft: true
          prerelease: false
