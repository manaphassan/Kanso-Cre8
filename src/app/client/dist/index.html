    <div class="splash-ambient-glow"></div>
    <div class="splash-content">

    </div>
  </div>

  <div id="app"></div>

  <script>
    // If running in native desktop launcher (WebView2), hide HTML splash instantly
    // because native WPF launcher renders the splash from frame 0
    if (window.chrome && window.chrome.webview) {
      var initialSplash = document.getElementById('kanso-boot-splash');
      if (initialSplash) {
        initialSplash.style.display = 'none';
      }
    }

    window.dismissKansoSplash = function() {
      var s = document.getElementById('kanso-boot-splash');
      if (s && !s.classList.contains('fading-out')) {
        s.classList.add('fading-out');
        setTimeout(function() {
          if (s && s.parentNode) {
            s.parentNode.removeChild(s);
          }
        }, 500);
      }
    };
    // Absolute failsafe: dismiss after 2.2s maximum regardless of network or script state
    setTimeout(function() {
      if (typeof window.dismissKansoSplash === 'function') {
        window.dismissKansoSplash();
      }
    }, 2200);
  </script>
