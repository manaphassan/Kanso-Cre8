<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="kansoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>
  <!-- Dark Background Canvas -->
  <rect width="512" height="512" rx="112" fill="#09090B" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#27272A" stroke-width="2" />
  
  <!-- Outer Minimalist Zen Ensō Arc -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#kansoGrad)" stroke-width="20" stroke-linecap="round" stroke-dasharray="880 140" stroke-dashoffset="60" />
  
  <!-- Inner Precision Creative Diamond / Vault Aperture -->
  <rect x="200" y="200" width="112" height="112" rx="20" transform="rotate(45 256 256)" fill="none" stroke="#F4F4F5" stroke-width="14" />
  
  <!-- Center Focus Dot -->
  <circle cx="256" cy="256" r="16" fill="#38BDF8" />
</svg>
