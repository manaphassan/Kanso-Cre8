<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --k-bg: #09090B;
        --k-border: #27272A;
        --k-accent: #38BDF8;
        --k-white: #F4F4F5;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --k-bg: #F8FAFC;
          --k-border: #E2E8F0;
          --k-accent: #0284C7;
          --k-white: #0F172A;
        }
      }
      .k-bg { fill: var(--k-bg); }
      .k-border { stroke: var(--k-border); }
      .k-accent { stroke: var(--k-accent); }
      .k-accent-fill { fill: var(--k-accent); }
      .k-white { stroke: var(--k-white); }
    </style>
  </defs>
  <rect width="128" height="128" rx="28" class="k-bg" />
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" class="k-border" stroke-width="1.5" />
  <circle cx="64" cy="64" r="40" fill="none" class="k-accent" stroke-width="6" stroke-linecap="round" stroke-dasharray="210 36" stroke-dashoffset="15" />
  <rect x="50" y="50" width="28" height="28" rx="5" transform="rotate(45 64 64)" fill="none" class="k-white" stroke-width="4" />
  <circle cx="64" cy="64" r="4" class="k-accent-fill" />
</svg>
