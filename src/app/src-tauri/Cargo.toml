[package]
name = "kanso-cre8"
version = "1.0.0"
description = "The Mindful Creative Vault — Local-First Project, Client & Knowledge Engine"
authors = ["harusssani.manaphassan"]
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
