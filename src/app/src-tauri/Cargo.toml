[package]
name = "kanso-cre8"
version = "0.8.0"
description = "The Mindful Creative Vault — Local-First Project, Client & Knowledge Engine"
authors = ["Kanso Cre8 Team"]
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5.0"
sha2 = "0.11.1"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
notify-debouncer-full = "0.7.0"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
