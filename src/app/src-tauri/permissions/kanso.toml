[[set]]
identifier = "kanso"
description = "Everything the Kanso Cre8 window may call: app mode, the open vault (guarded to its folder), ZIP export, save-as to a dialog-picked path, hashing, machine settings, radio now-playing, the AI key status (never the key), Gemini requests and the vault watcher."
permissions = [
  "allow-app-mode",
  "allow-vault-open",
  "allow-vault-root",
  "allow-vault-scan",
  "allow-list-dir",
  "allow-read-text",
  "allow-write-text-atomic",
  "allow-ensure-dirs",
  "allow-move-to-archive",
  "allow-copy-into-vault",
  "allow-write-bytes-atomic",
  "allow-copy-within",
  "allow-retire-vault-files",
  "allow-export-zip",
  "allow-sha256-file",
  "allow-save-text-as",
  "allow-save-file-as",
  "allow-machine-get",
  "allow-machine-set",
  "allow-radio-now-playing",
  "allow-ai-status",
  "allow-ai-set-key",
  "allow-ai-clear-key",
  "allow-ai-set-model",
  "allow-ai-test",
  "allow-ai-complete",
  "allow-settings-export",
  "allow-settings-inspect",
  "allow-settings-import",
  "allow-watch-status",
]
